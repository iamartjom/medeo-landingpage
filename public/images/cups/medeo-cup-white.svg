<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="cupWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#EFECE6" />
    </linearGradient>

    <linearGradient id="yellowBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>

    <filter id="softShadowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadowWhite)">
    <!-- Lid Top -->
    <path d="M120 120 C 120 112, 280 112, 280 120 L 285 140 C 285 146, 115 146, 115 140 Z" fill="#111111" />
    <path d="M160 112 C 160 106, 240 106, 240 112 Z" fill="#FAF8F5" />
    <rect x="110" y="138" width="180" height="18" rx="6" fill="#1A1A1A" />

    <!-- Main Cup Body -->
    <path d="M 120 156 L 280 156 L 255 510 C 253 526, 240 538, 224 538 L 176 538 C 160 538, 147 526, 145 510 Z" fill="url(#cupWhite)" />
    
    <!-- Editorial Accent Line -->
    <path d="M 121 175 L 279 175 L 277 205 L 123 205 Z" fill="url(#yellowBand)" />
    <text x="200" y="196" font-family="'Unbounded', sans-serif" font-weight="800" font-size="14" fill="#111111" text-anchor="middle" letter-spacing="3">AUTUMN SPECIAL</text>

    <!-- Black Sleeve -->
    <path d="M 129 270 L 271 270 L 264 390 L 136 390 Z" fill="#111111" />
    
    <!-- Sleeve Brand Typography -->
    <text x="200" y="325" font-family="'Unbounded', sans-serif" font-weight="900" font-size="34" fill="#FAF8F5" text-anchor="middle" letter-spacing="4">MEDEO</text>
    <text x="200" y="352" font-family="sans-serif" font-weight="700" font-size="10" fill="#FFC700" text-anchor="middle" letter-spacing="5">SEASONAL DESSERTS</text>
    
    <!-- Stamp -->
    <circle cx="200" cy="445" r="24" stroke="#111111" stroke-width="2" fill="none"/>
    <text x="200" y="449" font-family="'Unbounded', sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">450ml</text>
  </g>
</svg>
